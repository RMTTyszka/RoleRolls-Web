<p-panel>
  <ng-template #header>
    <div class="flex w-full items-center justify-between">
      <span class="p-panel-title">Equipment</span>
    </div>
  </ng-template>
  <rr-creature-equipment [form]="form"></rr-creature-equipment>
</p-panel>
<p-panel>
  <ng-template #header>
    <div class="flex w-full items-center justify-between">
      <span class="p-panel-title">Items</span>
    </div>
  </ng-template>
  <ng-template #icons>
    <button class="p-panel-header-icon" (click)="instanteItem()">
      <span class="pi pi-plus"></span>
    </button>
  </ng-template>
  <p-table [value]="itens" [tableStyle]="{ 'min-width': '50rem' }">
    <ng-template #header>
      <tr>
        <th style="width: 8rem;">
        <th>Name</th>
        <th>Level</th>
      </tr>
    </ng-template>
    <ng-template #body let-item let-index>
      <tr>
        <td style="width: 5px;">
          <p-button type="button" pTooltip="Remove" icon="pi pi-times" [styleClass]="'p-button-danger'" (click)="remove(item, index)" [style]="{ 'margin-right': '4px' }"></p-button>
          <p-button *ngIf="item.template.type !== itemType.Consumable" type="button" pTooltip="Equip" icon="fas fa-tshirt" [styleClass]="'p-button-primary'" (click)="equip(item, index)" [style]="{ 'margin-right': '4px' }"></p-button>
        </td>
        <td>{{ item.name }}</td>
        <td>{{ item.level }}</td>
      </tr>
    </ng-template>
  </p-table>
</p-panel>
