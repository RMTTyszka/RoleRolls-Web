<div class="grid grid-cols-1 gap-2">
  <div class="flex flex-col gap-2 w-full">
    <label for="damage-input">Damage</label>
    <p-inputnumber id="damage-input" [(ngModel)]="damageValue" class="w-full"/>
  </div>
  <div class="flex flex-col gap-2 w-full">
    <label for="damage-description">Description</label>
    <input id="damage-description" pInputText [(ngModel)]="damageDescription" class="w-full"/>
  </div>
  <div class="w-full">
    <div class="grid grid-cols-1 gap-2" *ngFor="let vitality of vitalities; let i = index;">
      <p-button (click)=takeDamage(vitality) [label]="vitality.name" styleClass="w-full danger-color" [disabled]="damageValue < 1"></p-button>
      <span class="w-full">Result: {{resultFromDamage(vitality)}}</span>
    </div>
  </div>
</div>
<p-divider></p-divider>

<div class="grid grid-cols-1 gap-2">
  <div class="flex flex-col gap-2 w-full">
    <label for="heal-input">Heal</label>
    <p-inputnumber id="heal-input" [(ngModel)]="healValue" class="w-full"/>
  </div>
  <div class="flex flex-col gap-2 w-full">
    <label for="heal-description">Description</label>
    <input id="heal-description" pInputText [(ngModel)]="healDescription" class="w-full"/>
  </div>
  <div class="w-full">
    <div class="grid grid-cols-1 gap-2" *ngFor="let vitality of vitalities; let i = index;">
      <p-button (click)=heal(vitality) [label]="vitality.name" styleClass="w-full success-color" [disabled]="healValue < 1"></p-button>
      <span class="w-full">Result: {{resultFromHeal(vitality)}}</span>
    </div>
  </div>
</div>
