<div class="flex justify-between gap-4">
  <rr-form-field-wrapper class="w-5/6">
    <!-- Campo Slot -->
    <ng-template class="p-inputgroup" fieldTitle="Desirable Chance">
        <p-inputnumber id="input" [(ngModel)]="expectedChance" [disabled]="calculating" class=""></p-inputnumber>
        <p-inputgroup-addon>
          <button  pButton type="button" [disabled]="true">%</button>
        </p-inputgroup-addon>
        <p-inputgroup-addon>
          <p-button (click)="simulate()" type="button" icon="fas fa-calculator" styleClass="p-button-secondary" [disabled]="calculating"></p-button>
        </p-inputgroup-addon>
    </ng-template>
  </rr-form-field-wrapper>
  <p-progressspinner class="w-1/6" [style]="{width: '28px', height: '28px'}" *ngIf="calculating"></p-progressspinner>
</div>


<p-table [value]="chances" responsiveLayout="scroll" class="mt-4">
  <ng-template #header>
    <tr>
      <th>Complexity</th>
      <th>Difficulty</th>
      <th>Chance</th>
    </tr>
  </ng-template>
  <ng-template #body let-chance>
    <tr>
      <td>{{ chance.complexity }}</td>
      <td>{{ chance.difficulty }}</td>
      <td>{{ chance.chance }} %</td>
    </tr>
  </ng-template>
</p-table>
