<form [formGroup]="form">
  <div class="p-inputgroup">
    <p-inputgroup-addon>
      Name
    </p-inputgroup-addon>
    <input pInputText formControlName="name">
    <p-inputgroup-addon>
      Level
    </p-inputgroup-addon>
    <input pInputNumber formControlName="level">
  </div>
</form>
<div class="mt-2 flex flex-wrap gap-4">
  <p-button label="Add" (click)="add()"></p-button>
  <p-button label="Cancel" (click)="cancel()"></p-button>
</div>
